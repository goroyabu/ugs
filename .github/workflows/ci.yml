name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  incremental-build:
    name: Incremental source preparation (${{ matrix.generator }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        generator:
          - Unix Makefiles
          - Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libx11-dev \
            libxaw7-dev \
            libxmu-dev \
            libxt-dev \
            ninja-build

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          -DNET_FETCH=ON
          -DBUILD_TESTING=ON
          -DUGS_ENABLE_GUI_SMOKE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test incremental source preparation
        run: >-
          ctest --test-dir build
          -R '^source_preparation\.'
          --output-on-failure

  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-24.04
            run_x11: true
          - name: macos-latest
            os: macos-15
            run_x11: false

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libx11-dev \
            libxaw7-dev \
            libxmu-dev \
            libxt-dev \
            xvfb

      - name: Install macOS dependencies
        if: matrix.os == 'macos-15'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install gcc libx11 libxaw libxmu libxt
          BREW_PREFIX="$(brew --prefix)"
          FC_PATH="$(brew --prefix)/bin/gfortran-15"
          echo "CMAKE_PREFIX_PATH=${BREW_PREFIX}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig" >> "${GITHUB_ENV}"
          echo "CPPFLAGS=-I${BREW_PREFIX}/include" >> "${GITHUB_ENV}"
          echo "LDFLAGS=-L${BREW_PREFIX}/lib" >> "${GITHUB_ENV}"
          echo "FC=${FC_PATH}" >> "${GITHUB_ENV}"

      - name: Configure
        run: cmake -S . -B build -DNET_FETCH=ON -DBUILD_TESTING=ON -DUGS_ENABLE_GUI_SMOKE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test display-independent contracts
        run: ctest --test-dir build -LE x11 --output-on-failure

      - name: Test X11 contracts
        if: matrix.run_x11
        run: xvfb-run --auto-servernum ctest --test-dir build -L x11 --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed package example
        run: |
          cmake -S examples/cmake -B build/package-example \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage" \
            -DUGS_EXPECTED_PREFIX="${{ github.workspace }}/stage"
          cmake --build build/package-example --parallel
          ctest --test-dir build/package-example --output-on-failure

  offline-build-and-test:
    name: Offline build and test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libx11-dev \
            libxaw7-dev \
            libxmu-dev \
            libxt-dev

      - name: Prepare verified offline archive
        env:
          UGS_ARCHIVE_SHA256: 27bc46e975917bdf149e9ff6997885ffa24b0b1416bdf82ffaea5246b36e1f83
        run: |
          mkdir -p "${RUNNER_TEMP}/ugs-offline-inputs"
          curl --fail --show-error --location --retry 3 \
            https://ftp.riken.jp/iris/ugs/ugs.tar.gz \
            --output "${RUNNER_TEMP}/ugs-offline-inputs/ugs.tar.gz"
          echo "${UGS_ARCHIVE_SHA256}  ${RUNNER_TEMP}/ugs-offline-inputs/ugs.tar.gz" | sha256sum --check -

      - name: Configure without network fetching
        run: >-
          cmake -S . -B build
          -DNET_FETCH=OFF
          -DARCHIVE_DIR="${RUNNER_TEMP}/ugs-offline-inputs"
          -DBUILD_TESTING=ON
          -DUGS_ENABLE_GUI_SMOKE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test display-independent contracts
        run: ctest --test-dir build -LE x11 --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed package example
        run: |
          cmake -S examples/cmake -B build/package-example \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage" \
            -DUGS_EXPECTED_PREFIX="${{ github.workspace }}/stage"
          cmake --build build/package-example --parallel
          ctest --test-dir build/package-example --output-on-failure

  minimum-cmake:
    name: Minimum CMake 3.15.7 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libx11-dev \
            libxaw7-dev \
            libxmu-dev \
            libxt-dev

      - name: Set up minimum supported CMake
        env:
          CMAKE_VERSION: 3.15.7
          CMAKE_SHA256: 8456a10ac2fd0dc97d13aa4753431a232cf32aecb0976541f7bf867a3f90ec57
        run: |
          archive="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-Linux-x86_64.tar.gz"
          install_dir="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-Linux-x86_64"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-Linux-x86_64.tar.gz" \
            --output "${archive}"
          echo "${CMAKE_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DNET_FETCH=ON -DBUILD_TESTING=ON -DUGS_ENABLE_GUI_SMOKE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test display-independent contracts
        run: cmake -E chdir build ctest -LE x11 --output-on-failure

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Verify installed package example
        run: |
          cmake -S examples/cmake -B build/package-example \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage" \
            -DUGS_EXPECTED_PREFIX="${{ github.workspace }}/stage"
          cmake --build build/package-example --parallel
          cmake -E chdir build/package-example ctest --output-on-failure
